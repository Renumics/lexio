packages:
  - lexio
  - examples/*/frontend

# Three days, in minutes.
minimumReleaseAge: 4320

# Preserve compatibility and security fixes for transitive dependencies.
# uuid 11 supports the CommonJS consumers in Storybook and ExcelJS.
overrides:
  '@microsoft/api-extractor>minimatch': '>=10.2.3'
  '@storybook/addon-actions>uuid': '^11.1.1'
  'exceljs>uuid': '^11.1.1'
  'refractor>prismjs': '^1.30.0'
  '@typescript-eslint/typescript-estree>minimatch': '9.0.9'
  '@tailwindcss/typography>postcss-selector-parser': '6.1.6'

allowBuilds:
  esbuild: true
  unrs-resolver: true
