name: Set up project tools
description: Install the tool versions pinned in .tool-versions and cache dependencies
inputs:
  python-version:
    description: Override Python for compatibility tests
    default: ''
runs:
  using: composite
  steps:
    - id: versions
      shell: bash
      run: |
        awk '{print $1 "=" $2}' .tool-versions >> "$GITHUB_OUTPUT"
    - uses: pnpm/action-setup@v4
      with:
        version: ${{ steps.versions.outputs.pnpm }}
        run_install: false
    - uses: actions/setup-node@v6
      with:
        node-version: ${{ steps.versions.outputs.nodejs }}
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml
    - uses: astral-sh/setup-uv@v10
      with:
        version: ${{ steps.versions.outputs.uv }}
        python-version: ${{ inputs.python-version || steps.versions.outputs.python }}
        enable-cache: true
        cache-dependency-glob: '**/uv.lock'
