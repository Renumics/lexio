name: Release to NPM

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags
  workflow_dispatch:  # Allows manual triggering

permissions:
  contents: read

jobs:
  validate-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check release versions
        run: python .github/scripts/check-release-version.py

  checks:
    needs: validate-version
    uses: ./.github/workflows/check.yml  # Reuse the check workflow (for lint/test/typecheck only)

  publish:
    needs: checks  # Wait for checks to pass
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.14"
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          cache-dependency-path: './lexio/package-lock.json'

      - name: Install dependencies
        working-directory: ./lexio
        run: npm ci

      - name: Build the library
        working-directory: ./lexio
        run: npm run build

      - name: Dry run npm publish
        working-directory: ./lexio
        run: npm publish --dry-run --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to NPM
        if: startsWith(github.ref, 'refs/tags/v')  # Only run on version tags
        working-directory: ./lexio
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
