name: Release to Test PyPI
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup-tools
      - name: Check release versions
        run: uv run --no-project python .github/scripts/check-release-version.py
  build-and-check:
    needs: validate-version
    uses: ./.github/workflows/python-build-and-check.yml
  publish:
    needs: build-and-check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup-tools
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-dist
          path: python/lexio/dist
      - name: Publish to Test PyPI
        run: uv publish --publish-url https://test.pypi.org/legacy/ python/lexio/dist/*
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.TEST_PYPI_TOKEN }}
