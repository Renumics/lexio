name: Python CI
on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-tools
      - run: pnpm install --frozen-lockfile
      - run: pnpm build-python-package
      - name: Check package metadata
        working-directory: python/lexio
        run: uv run --locked twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: python/lexio/dist/
          retention-days: 2
  test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-tools
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: python/lexio/dist
      - name: Test installed wheel
        working-directory: python/lexio
        run: |
          uv venv
          uv pip install dist/*.whl pytest pytest-asyncio pytest-cov
          cd tests
          uv run --no-project --no-sync python -I -m pytest . --import-mode=importlib -v
