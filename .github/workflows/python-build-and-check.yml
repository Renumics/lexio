name: Python CI
on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup-tools
        with:
          enable-uv-cache: 'true'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build-python-package
      - name: Check package metadata
        working-directory: python/lexio
        run: uv run --locked twine check dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-dist
          path: python/lexio/dist/
          retention-days: 2
  test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup-tools
        with:
          python-version: ${{ matrix.python-version }}
          enable-uv-cache: 'true'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-dist
          path: python/lexio/dist
      - name: Test installed wheel
        working-directory: python/lexio
        run: |
          uv venv
          uv pip install dist/*.whl pytest pytest-asyncio pytest-cov
          cd tests
          uv run --no-project --no-sync python -I -m pytest . --import-mode=importlib -v
